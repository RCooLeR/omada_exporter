name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  bridge:
    name: Bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Download Go modules
        run: go mod download
        working-directory: bridge

      - name: Verify downloaded modules
        run: go mod verify
        working-directory: bridge

      - name: Verify Go modules are tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
        working-directory: bridge

      - name: Run Go tests with the race detector
        run: go test -race -shuffle=on -count=1 ./...
        working-directory: bridge

      - name: Run Go vet
        run: go vet ./...
        working-directory: bridge

      - name: Build bridge binary
        run: go build -trimpath ./...
        working-directory: bridge

      - name: Scan Go dependencies for reachable vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
          work-dir: bridge
          go-package: ./...

  ha-cards:
    name: Home Assistant cards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ha-cards/package-lock.json

      - name: Install card dependencies
        run: npm ci
        working-directory: ha-cards

      - name: Audit card dependencies
        run: npm audit --audit-level=high
        working-directory: ha-cards

      - name: Typecheck cards
        run: npm run typecheck
        working-directory: ha-cards

      - name: Test cards
        run: npm test
        working-directory: ha-cards

      - name: Build cards
        run: npm run build
        working-directory: ha-cards

  container:
    name: Container and release configuration
    needs: bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build multi-platform development image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07d69fabb52f1e5bc # v7.3.0
        with:
          context: bridge
          file: bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=ci
          pull: true
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=bridge-container
          cache-to: type=gha,mode=max,scope=bridge-container

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
