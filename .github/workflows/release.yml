name: Release with GoReleaser

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ha-cards/package-lock.json

      - name: Set up pinned npm
        run: |
          npm install --global "$(node -p 'require("./ha-cards/package.json").packageManager')"
          npm --version

      - name: Validate and build Home Assistant release bundle
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build
          test -s dist/omada-network-card.js
        working-directory: ha-cards

      - name: Validate Grafana release dashboards
        run: |
          go generate ./docs/dashboards
          git diff --exit-code -- docs/dashboards/*.json
          go test ./internal/app -run '^TestGrafanaDashboards' -count=1
          for dashboard in dashboard.json omada-device-details.json simple-omada-dashboard.json; do
            test -s "docs/dashboards/${dashboard}"
          done
        working-directory: bridge

      - name: Smoke test release image
        run: |
          smoke_dir="${RUNNER_TEMP}/omada-exporter-smoke/linux/amd64"
          mkdir -p "${smoke_dir}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C bridge -trimpath -ldflags "-s -w -X github.com/RCooLeR/omada_exporter/cmd.version=${GITHUB_REF_NAME#v}" -o "${smoke_dir}/omada-exporter" .
          docker buildx build --load --pull --platform linux/amd64 -f bridge/Dockerfile.goreleaser -t omada-exporter-smoke:${GITHUB_REF_NAME#v} "${RUNNER_TEMP}/omada-exporter-smoke"
          docker run --rm omada-exporter-smoke:${GITHUB_REF_NAME#v} --version

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          create-storage-record: false

      - name: Attest container images
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/digests.txt
          create-storage-record: false
