# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.19.0/www/docs/static/schema.json

version: 2

project_name: omada-exporter

builds:
  - id: omada_exporter
    dir: bridge
    main: .
    binary: omada-exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/RCooLeR/omada_exporter/cmd.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
          - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  # Keep these inputs outside the root dist directory: release --clean removes it.
  extra_files:
    - glob: ha-cards/dist/omada-network-card.js
    - glob: bridge/docs/dashboards/dashboard.json
    - glob: bridge/docs/dashboards/omada-device-details.json
    - glob: bridge/docs/dashboards/simple-omada-dashboard.json

docker_digest:
  name_template: "digests.txt"

release:
  github:
    owner: RCooLeR
    name: omada_exporter
  draft: false
  prerelease: auto
  # These must also be listed in checksum.extra_files for checksum attestations.
  extra_files:
    - glob: ha-cards/dist/omada-network-card.js
    - glob: bridge/docs/dashboards/dashboard.json
    - glob: bridge/docs/dashboards/omada-device-details.json
    - glob: bridge/docs/dashboards/simple-omada-dashboard.json

dockers_v2:
  - id: omada_exporter
    ids:
      - omada_exporter
    dockerfile: bridge/Dockerfile.goreleaser
    images:
      - rcooler/omada_exporter
      - rcooler/omada-exporter
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    annotations:
      "index,manifest:org.opencontainers.image.created": "{{ .Date }}"
      "index,manifest:org.opencontainers.image.description": "Prometheus exporter and Home Assistant bridge for TP-Link Omada controllers"
      "index,manifest:org.opencontainers.image.licenses": MIT
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.source": "{{ .GitURL }}"
      "index,manifest:org.opencontainers.image.title": "{{ .ProjectName }}"
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
    flags:
      - "--pull=true"
      - "--provenance=mode=max"
